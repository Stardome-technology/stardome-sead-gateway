# Remote compose file — pulls the pre-built gateway image from ghcr.io.
# Usage: docker compose -f docker-compose.remote.yml up -d
#
# The gateway is the single public HTTPS entry point for a SEAD node. It
# terminates TLS, enforces auth, and routes to the internal C++ services
# (sead-core, edge-service, storage-gateway, source-data-service) over the
# shared `sead-network` bridge. It must run alongside a SEAD stack (see
# https://github.com/Stardome-technology/stardome-sead).

services:
  gateway:
    # Pinned to a release tag AND the digest of the multi-arch index ghcr.io
    # serves for it, so a node runs that build until the pin is bumped here.
    # `latest` is not used: it moves with every publish, and from v0.1.0 the
    # image runs as `sead` (uid/gid 10001), which changes what it can read.
    # Bump both the tag and the digest together:
    #   docker buildx imagetools inspect \
    #     ghcr.io/stardome-technology/stardome-sead-gateway:0.1.0
    # and take the `Digest:` line under `Name:`, not a per-platform digest.
    image: ghcr.io/stardome-technology/stardome-sead-gateway:0.1.0@sha256:5f9046952a2f3c7bd789996ef8c473659d53973447da099111a4b66ce185414f
    container_name: stardome-sead-gateway
    ports:
      - "30080:30080"
    volumes:
      - ./certs:/etc/gateway/certs:ro
    env_file:
      - path: .env
        required: true
    environment:
      - GATEWAY_LISTEN_ADDR=${GATEWAY_LISTEN_ADDR:-:30080}
      - GATEWAY_TLS_ENABLED=${GATEWAY_TLS_ENABLED:-true}
      - GATEWAY_TLS_CERT=${GATEWAY_TLS_CERT:-/etc/gateway/certs/server.crt}
      - GATEWAY_TLS_KEY=${GATEWAY_TLS_KEY:-/etc/gateway/certs/server.key}
      - GATEWAY_AUTH_ENABLED=${GATEWAY_AUTH_ENABLED:-true}
      - SEAD_AUTH_SECRET=${SEAD_AUTH_SECRET:-}
      - GATEWAY_EDGE_TOKENS=${GATEWAY_EDGE_TOKENS:-}
      - GATEWAY_AUTH_CBOR_ENABLED=${GATEWAY_AUTH_CBOR_ENABLED:-true}
      # Key resolution uses the SVC_SEAD_CORE_GRPC gRPC target
      - GATEWAY_AUTH_CBOR_CACHE_TTL=${GATEWAY_AUTH_CBOR_CACHE_TTL:-60}
      - GATEWAY_AUTH_CBOR_SKEW_TOLERANCE=${GATEWAY_AUTH_CBOR_SKEW_TOLERANCE:-30}
      - GATEWAY_METRICS_ENABLED=${GATEWAY_METRICS_ENABLED:-true}
      - GATEWAY_LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - GATEWAY_READ_TIMEOUT=${GATEWAY_READ_TIMEOUT:-30s}
      - GATEWAY_WRITE_TIMEOUT=${GATEWAY_WRITE_TIMEOUT:-30s}
      - GATEWAY_IDLE_TIMEOUT=${GATEWAY_IDLE_TIMEOUT:-90s}
      - GATEWAY_PROXY_TIMEOUT=${GATEWAY_PROXY_TIMEOUT:-30s}
      # Internal C++ services (gRPC-only, Go Gateway migration phase 4.4)
      - SVC_SEAD_CORE_GRPC=${SVC_SEAD_CORE_GRPC:-sead-core:50051}
      - SVC_EDGE_SERVICE_GRPC=${SVC_EDGE_SERVICE_GRPC:-edge-service:50055}
      - SVC_STORAGE_GRPC=${SVC_STORAGE_GRPC:-storage-gateway:50052}
      - SVC_SOURCE_DATA_GRPC=${SVC_SOURCE_DATA_GRPC:-source-data-service:50053}
      - GATEWAY_GRPC_PORT=${GATEWAY_GRPC_PORT:-50054}
    healthcheck:
      # The v0.1.0 image dropped `wget` (change gateway-healthcheck-subcommand),
      # so a wget-based probe can never pass and the container stays unhealthy
      # forever. The gateway's own subcommand loads the same config the server
      # loads, so it follows GATEWAY_TLS_ENABLED and GATEWAY_LISTEN_ADDR, and it
      # skips TLS verification on purpose (it is a self-probe of our own cert).
      # Exit codes are a stable contract: 0 healthy, 3 listener down,
      # 4 backends unreachable, 5 draining.
      test: ["CMD", "/app/gateway", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - sead-network

networks:
  sead-network:
    name: sead-network
    external: true